[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-live"
version = "0.2.0"
description = "Reproducible paper evaluations with commit-aware caching and interactive reports"
requires-python = ">=3.10"
# rich powers the terminal renderer (Registry.render_to_console); lightweight
# and always available for simplicity.
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
# Only Registry.render_to_dir (local on-disk PDF/JSON/LaTeX rendering) needs a local
# matplotlib. The browser viewer uses Pyodide's own matplotlib. Install with
# `pip install -e .[render]` to use the local renderer.
render = ["matplotlib>=3.5"]
docs = ["sphinx>=7,<10"]
test = ["hypothesis>=6.100,<7"]

[tool.setuptools.packages.find]
include = ["eval_live*"]

[tool.setuptools.package-data]
eval_live = ["*.js", "*.css", "*.py", "*.html", "vendor/*.js"]
